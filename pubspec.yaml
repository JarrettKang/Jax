name: jax
description: "Jax local-first life manager."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.1
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2+1
  uuid: ^4.6.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

# Windows includes winsqlite3.dll. Reusing it keeps v0.1 builds offline and
# avoids downloading native binaries during tests. Android uses the sqflite
# platform driver while sharing the same schema and Repository implementation.
hooks:
  user_defines:
    sqlite3:
      source: system
      name: winsqlite3
