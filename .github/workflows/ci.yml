name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # Host SQLite tests use the project's Windows winsqlite3 native hook.
    runs-on: windows-2022
    timeout-minutes: 45
    # Avoid the runner profile's 8.3 TEMP alias: safety checks compare resolved paths.
    env:
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.1'
          channel: stable
      - name: Select CI JDK
        run: flutter config --jdk-dir "$env:JAVA_HOME"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Host tests
        run: flutter test
      - name: Windows build smoke
        run: flutter build windows --release
      - name: Android Debug build smoke (no signing secrets)
        run: flutter build apk --debug
